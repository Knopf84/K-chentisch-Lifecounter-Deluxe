<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drucktest M110</title>
<style>
:root{
  --bg:#f2f3f5;--card:#fff;--text:#1a1d23;--muted:#5c6470;--line:#d3d7de;--btn:#1a1d23;--btn-text:#fff;--ok:#1b7a3a;--bad:#b3261e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#101216;--card:#1d2027;--text:#eceff4;--muted:#9aa1ad;--line:#343842;--btn:#eceff4;--btn-text:#15171b;--ok:#6fd08c;--bad:#ff8a80;}
}
:root[data-theme="dark"]{--bg:#101216;--card:#1d2027;--text:#eceff4;--muted:#9aa1ad;--line:#343842;--btn:#eceff4;--btn-text:#15171b;--ok:#6fd08c;--bad:#ff8a80;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:16px;}
main{max-width:620px;margin:0 auto;display:grid;gap:14px;}
h1{font-size:22px;margin:4px 0 0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;}
button{font:inherit;min-height:52px;padding:0 18px;border-radius:12px;border:0;background:var(--btn);color:var(--btn-text);font-weight:600;cursor:pointer;touch-action:manipulation;}
button.sec{background:transparent;color:var(--text);border:2px solid var(--line);}
button:disabled{opacity:.4;}
select{font:inherit;min-height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--text);padding:0 10px;width:100%;}
label{display:grid;gap:4px;color:var(--muted);font-size:14px;}
canvas{max-width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;image-rendering:pixelated;}
#log{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:160px;max-height:360px;overflow:auto;}
.status{font-weight:600;}
.status.ok{color:var(--ok);}
.status.bad{color:var(--bad);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
:focus-visible{outline:3px solid #2f6db0;outline-offset:2px;}
</style>
</head>
<body>
<main>
  <h1>Drucktest Phomemo M110</h1>

  <div class="card">
    <div id="status" class="status">Noch nicht verbunden</div>
    <div class="row">
      <button id="btnConnect">Drucker verbinden</button>
      <button id="btnAll" class="sec">Alle Geräte zeigen</button>
    </div>
    <p style="margin:0;color:var(--muted);font-size:14px">Drucker einschalten, Bluetooth am iPad an, Seite im Browser Bluefy öffnen. Die erste Taste sucht nach Geräten, die mit „M110“ beginnen. Taucht dein Drucker nicht auf, nimm die zweite.</p>
  </div>

  <div class="card">
    <label>Befehlsfolge
      <select id="profile">
        <option value="A">Profil A: mit Tempo, Dichte und Abschluss</option>
        <option value="B">Profil B: nur das Rasterbild</option>
      </select>
    </label>
    <canvas id="prev" width="384" height="160" aria-label="Vorschau des Testbilds"></canvas>
    <button id="btnPrint" disabled>Testdruck</button>
  </div>

  <div class="card">
    <strong>Protokoll</strong>
    <div id="log" aria-live="polite"></div>
    <button id="btnCopy" class="sec">Protokoll kopieren</button>
  </div>
</main>

<script>
(function(){
  var logEl=document.getElementById('log'),statusEl=document.getElementById('status');
  var btnPrint=document.getElementById('btnPrint');
  var device=null,chr=null;

  function log(t){logEl.textContent+=t+'\n';logEl.scrollTop=logEl.scrollHeight;}
  function setStatus(t,cls){statusEl.textContent=t;statusEl.className='status'+(cls?' '+cls:'');}
  function hex(a){return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2);}).join(' ');}

  if(!navigator.bluetooth){
    setStatus('Dieser Browser kann kein Bluetooth. Öffne die Seite in Bluefy.','bad');
    log('navigator.bluetooth fehlt. Safari und die Claude App unterstützen Web Bluetooth nicht.');
  }

  /* Testbild: 384 Punkte breit (48 Byte), 160 Zeilen, schwarz auf weiß */
  var W=384,H=160;
  function drawTest(){
    var c=document.getElementById('prev'),x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,W,H);
    x.fillStyle='#000';
    x.fillRect(0,0,W,6);x.fillRect(0,H-6,W,6);x.fillRect(0,0,6,H);x.fillRect(W-6,0,6,H);
    x.textAlign='center';x.textBaseline='middle';
    x.font='bold 54px Arial, sans-serif';x.fillText('TEST',W/2,58);
    x.font='bold 30px Arial, sans-serif';x.fillText('Soldat 1/1 weiß',W/2,112);
  }
  function bitmap(){
    var c=document.getElementById('prev'),d=c.getContext('2d').getImageData(0,0,W,H).data;
    var bpl=W/8,out=new Uint8Array(bpl*H);
    for(var y=0;y<H;y++){
      for(var xx=0;xx<W;xx++){
        var i=(y*W+xx)*4,lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        if(lum<128)out[y*bpl+(xx>>3)]|=(0x80>>(xx&7));
      }
    }
    return out;
  }

  async function connect(all){
    try{
      var opts=all?{acceptAllDevices:true}:{filters:[{namePrefix:'M110'}]};
      opts.optionalServices=[0xff00,0xff80,'e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455'];
      log('Suche Geräte …');
      device=await navigator.bluetooth.requestDevice(opts);
      log('Gewählt: '+(device.name||'ohne Namen'));
      var server=await device.gatt.connect();
      log('Verbunden. Lese Dienste …');
      var services=await server.getPrimaryServices(),cand=null,fb=null;
      for(var s of services){
        log('Dienst '+s.uuid);
        var chars=await s.getCharacteristics();
        for(var ch of chars){
          var p=[];for(var k in ch.properties){if(ch.properties[k])p.push(k);}
          log('  Merkmal '+ch.uuid+' ('+p.join(', ')+')');
          var canW=ch.properties.writeWithoutResponse||ch.properties.write;
          if(canW&&!fb)fb=ch;
          if(canW&&ch.uuid.indexOf('ff02')>=0)cand=ch;
        }
      }
      chr=cand||fb;
      if(!chr){setStatus('Verbunden, aber keine beschreibbare Schnittstelle gefunden','bad');log('Keine Schreibschnittstelle. Bitte dieses Protokoll weitergeben.');return;}
      log('Schreibe über '+chr.uuid);
      setStatus('Verbunden mit '+(device.name||'Gerät'),'ok');
      btnPrint.disabled=false;
      device.addEventListener('gattserverdisconnected',function(){setStatus('Verbindung getrennt','bad');btnPrint.disabled=true;log('Verbindung getrennt.');});
    }catch(e){
      setStatus('Verbinden fehlgeschlagen','bad');
      log('Fehler: '+(e&&e.name?e.name+': ':'')+(e&&e.message?e.message:e));
    }
  }

  async function send(bytes,chunk){
    for(var i=0;i<bytes.length;i+=chunk){
      var part=bytes.slice(i,i+chunk);
      if(chr.properties.writeWithoutResponse)await chr.writeValueWithoutResponse(part);
      else await chr.writeValue(part);
      if((i/chunk)%8===7)await new Promise(function(r){setTimeout(r,12);});
    }
  }

  async function print(){
    btnPrint.disabled=true;
    try{
      var prof=document.getElementById('profile').value;
      var bpl=W/8,img=bitmap();
      var head=[0x1d,0x76,0x30,0x00,bpl&255,bpl>>8,H&255,H>>8];
      var pre=prof==='A'?[0x1b,0x4e,0x0d,0x05,0x1b,0x4e,0x04,0x08]:[];
      var post=prof==='A'?[0x1f,0xf0,0x05,0x00,0x1f,0xf0,0x03,0x00]:[];
      var all=new Uint8Array(pre.length+head.length+img.length+post.length);
      all.set(pre,0);all.set(head,pre.length);all.set(img,pre.length+head.length);all.set(post,pre.length+head.length+img.length);
      log('Sende Profil '+prof+': '+all.length+' Byte, Kopf '+hex(head));
      var sizes=[100,20],done=false;
      for(var n=0;n<sizes.length&&!done;n++){
        try{await send(all,sizes[n]);done=true;log('Gesendet in Stücken zu '+sizes[n]+' Byte.');}
        catch(e){log('Blockgröße '+sizes[n]+' ging nicht: '+(e&&e.message?e.message:e));}
      }
      if(!done)throw new Error('Senden nicht möglich');
      log('Fertig. Kommt Papier heraus? Wenn nicht, probiere das andere Profil.');
    }catch(e){
      log('Fehler beim Drucken: '+(e&&e.message?e.message:e));
    }
    btnPrint.disabled=!(device&&device.gatt.connected);
  }

  document.getElementById('btnConnect').addEventListener('click',function(){connect(false);});
  document.getElementById('btnAll').addEventListener('click',function(){connect(true);});
  btnPrint.addEventListener('click',print);
  document.getElementById('btnCopy').addEventListener('click',function(){
    var t=logEl.textContent;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){log('Kopiert.');},function(){log('Kopieren nicht erlaubt. Text markieren und kopieren.');});}
    else log('Kopieren nicht möglich. Text markieren und kopieren.');
  });
  drawTest();
  log('Bereit.');
})();
</script>
</body>
</html>
